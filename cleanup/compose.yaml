services:
  cleanup:
    image: hdqaz-worker-worker
    init: true
    restart: unless-stopped
    env_file: cleanup.env
    user: '10001:10001'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.25
    tmpfs: ['/tmp:size=16m,mode=1777']
    command: [python, /cleanup/executor.py]
    volumes:
      - ./executor.py:/cleanup/executor.py:ro
      - /opt/hdqaz-worker/runtime/sources:/sources
      - /opt/hdqaz-worker/runtime/work:/work
      - /opt/hdqaz-worker/runtime/storage:/storage
      - /opt/hdqaz-bot/runtime/state:/bot-state:ro
    healthcheck:
      test: [CMD, python, -c, 'import time,pathlib; assert time.time()-pathlib.Path("/tmp/cleanup-heartbeat").stat().st_mtime<330']
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
